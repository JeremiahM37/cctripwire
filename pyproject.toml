[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cctripwire"
version = "0.1.0"
description = "A circuit breaker for runaway Claude Code agents: stops claude -p storms before they burn your allowance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jeremiah Mackey"}]
dependencies = []
keywords = ["claude", "claude-code", "agents", "circuit-breaker", "rate-limit", "usage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/JeremiahM37/cctripwire"
Issues = "https://github.com/JeremiahM37/cctripwire/issues"
Changelog = "https://github.com/JeremiahM37/cctripwire/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cctripwire = "cctripwire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cctripwire = ["web/*.html", "presets/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
