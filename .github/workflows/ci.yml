name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: no stray fake claude processes
        run: "! pgrep -f '[t]ests/fake_claude.py'"
      - name: demo storm is cut off
        run: cctripwire demo -n 100
      - name: example configs validate
        run: |
          export CCTRIPWIRE_HOME=$(mktemp -d)
          cctripwire --config examples/config.toml config validate
          cctripwire --config examples/runaway-only.toml config validate
